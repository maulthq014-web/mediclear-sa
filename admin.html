<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medi-Clear Super Admin v4</title>
<style>
body{font-family:Arial,sans-serif;background:#0f172a;color:white;margin:0;padding:15px}
.card{background:#1e293b;padding:15px;border-radius:10px;margin:10px 0}
input{padding:10px;border-radius:8px;border:none;width:65%}
button{padding:10px 14px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-left:5px}
.save{background:#ef4444;color:white}.refresh{background:#2563eb;color:white}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th,td{padding:8px;border-bottom:1px solid #334155;text-align:left}
.searchBox{background:#0f172a;border:1px solid #334155 !important;width:40% !important}
</style>
</head>
<body>
<h2>Super Admin Dashboard - LIVE v4 Search</h2>
<div class="card">
<input id="urlInput" placeholder="Paste Web App URL">
<button class="save" onclick="saveUrl()">Save</button>
<button class="refresh" onclick="loadData()">Refresh</button>
<br><br>
<input id="searchInput" class="searchBox" placeholder="Search by Code e.g. MC001">
<button class="refresh" onclick="searchData()">Search</button>
<button class="refresh" style="background:#64748b" onclick="clearSearch()">Clear</button>
<small id="status"></small>
</div>
<div class="card"><h3 id="rev">Revenue: Loading...</h3><div id="counts"></div></div>
<div class="card">
<h3>Full Companies Table</h3>
<table><thead><tr><th>Date</th><th>Code</th><th>Name</th><th>Owner</th><th>Province</th><th>Plan</th><th>Status</th></tr></thead><tbody id="compTable"><tr><td colspan=7>Loading...</td></tr></tbody></table>
</div>
<script>
const DEFAULT_URL='https://script.google.com/macros/s/AKfycbzGlrpKO-PEIal_7tL5Bvs0JT2EgNz50Jf_eHpgT_sA2_w3Jux-D9Ur2I0th3DUQ_U/exec';
function getUrl(){return localStorage.getItem('mc_sheet_url')||DEFAULT_URL;}
function saveUrl(){const v=document.getElementById('urlInput').value.trim()||DEFAULT_URL;localStorage.setItem('mc_sheet_url',v);document.getElementById('status').innerText='Saved!';loadData();}
window.onload=()=>{document.getElementById('urlInput').value=getUrl();loadData();};
async function loadData(){
 const url=getUrl(); let filter=document.getElementById('searchInput').value.trim();
 let fetchUrl=url+'?action=getAll'+(filter?'&company_code='+encodeURIComponent(filter):'');
 document.getElementById('status').innerText='Loading...';
 try{
  const res=await fetch(fetchUrl); const data=await res.json();
  const comps=data.companies||[]; 
  let rev=0; comps.forEach(c=>{let p=(c.plan||'').toString(); if(p.includes('499'))rev+=499; else if(p.includes('899'))rev+=899; else if(p.includes('1499'))rev+=1499;});
  document.getElementById('rev').innerHTML='Revenue: R'+rev+'/month | '+comps.length+' Companies';
  let html=''; comps.forEach(c=>{
   html+='<tr><td>'+(c.timestamp||'')+'</td><td>'+(c.company_code||'')+'</td><td>'+(c.company_name||'')+'</td><td>'+(c.owner||'')+'</td><td>'+(c.province||'')+'</td><td>'+(c.plan||'')+'</td><td>'+(c.status||'PENDING')+' '+(c.status=='PENDING'?'<button onclick="activate(\''+c.company_code+'\')" style="background:#22c55e;color:white;border:none;border-radius:4px;padding:2px 6px;cursor:pointer">Activate</button>':'')+'</td></tr>';
  });
  document.getElementById('compTable').innerHTML=html||'<tr><td colspan=7>No results</td></tr>';
  document.getElementById('status').innerText='Live: '+comps.length;
 }catch(e){document.getElementById('status').innerText='Error: '+e.message;}
}
function searchData(){loadData();}
function clearSearch(){document.getElementById('searchInput').value='';loadData();}
async function activate(code){
 if(!confirm('Activate '+code+'?')) return;
 const url=getUrl();
 try{
  await fetch(url,{method:'POST',body:JSON.stringify({action:'updateStatus',companyCode:code,status:'ACTIVE'})});
  alert(code+' Activated!'); loadData();
 }catch(e){alert('Error: '+e.message);}
}
</script>
</body>
</html>
